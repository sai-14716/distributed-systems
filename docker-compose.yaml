services:
  # Laptop B only
  backend-4:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    environment:
      - SERVER_ID=B4
    ports:
      - "8084:8080"
    networks:
      - sdnet
  backend-5:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    environment:
      - SERVER_ID=B5
    ports:
      - "8085:8080"
    networks:
      - sdnet 
  backend-6:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    environment:
      - SERVER_ID=B6
    ports:
      - "8086:8080"
    networks:
      - sdnet
  backend-7:
    build:
      context: .
      dockerfile: services/backend/Dockerfile
    environment:
      - SERVER_ID=B7
    ports:
      - "8087:8080"
    networks:
      - sdnet
  node3:
    build:
      context: .
      dockerfile: cmd/node/Dockerfile
    environment:
      NODE_ID: node3
      HTTP_ADDR: :19090
      # Must be reachable by peers on other machines (Laptop B port mapping: 19093 -> 19090)
      SELF_URL: http://${LAPTOP_B_IP}:19093
      STATE_FILE: /var/lib/raft/state.json
      # Cross-machine peer URLs (no Docker service-name resolution)
      PEERS: http://${LAPTOP_A_IP}:19091,http://${LAPTOP_A_IP}:19092,http://${LAPTOP_C_IP}:19094,http://${LAPTOP_C_IP}:19095
      # Full backend list (IDs backend-1..backend-10 based on list order)
      BACKENDS: http://${LAPTOP_A_IP}:8081,http://${LAPTOP_A_IP}:8082,http://${LAPTOP_A_IP}:8083,http://${LAPTOP_B_IP}:8084,http://${LAPTOP_B_IP}:8085,http://${LAPTOP_B_IP}:8086,http://${LAPTOP_B_IP}:8087,http://${LAPTOP_C_IP}:8088,http://${LAPTOP_C_IP}:8089,http://${LAPTOP_C_IP}:8090
      LB_ADDR: :8000
      LB_CONTROL_ADDR: 127.0.0.1:18080
      DATAPLANE_CONTROL_URL: http://127.0.0.1:18080
    volumes:
      - node3_data:/var/lib/raft
    ports:
      - "8000:8000"
      - "19093:19090"
    networks:
      - sdnet

  admin:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: cmd/admin/Dockerfile
    environment:
      # node3 is local, so we use its internal Docker name and port
      # All other nodes are remote, so we use Laptop IPs and mapped ports
      TARGETS: >
        http://${LAPTOP_A_IP}:19091,
        http://${LAPTOP_A_IP}:19092,
        http://node3:19090,
        http://${LAPTOP_C_IP}:19094,
        http://${LAPTOP_C_IP}:19095
    depends_on:
      - node3
    networks:
      - sdnet
  k6-client:
    profiles: ["loadtest"]
    build:
      context: .
      dockerfile: clients/k6/Dockerfile
    environment:
      # Discovery runs on Laptop A
      DISCOVERY_DNS_ADDR: ${LAPTOP_A_IP}:6699
      DISCOVERY_CLIENT_LISTEN: 127.0.0.1:6700
    depends_on:
      - node3
      - backend-4
      - backend-5
      - backend-6
      - backend-7
    networks:
      - sdnet

volumes:
  node3_data:

networks:
  sdnet:
    driver: bridge
