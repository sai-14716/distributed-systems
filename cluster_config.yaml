# Distributed Cluster Topology Configuration
# This file defines which services run on which laptops and their exposed ports.
# All inter-machine communication must use these exact IPs and ports.
#
# To use: Update the laptop IPs below and ensure all scripts source this file.

# Laptop IP addresses - UPDATE THESE WITH ACTUAL MACHINE IPs
laptops:
  A: "10.5.15.20" # Primary control plane + discovery + some backends
  B: "10.5.15.19" # Secondary control plane + some backends
  C: "10.5.15.231" # Tertiary control plane + some backends

# Control plane nodes (Raft cluster)
# Note: node2 on Laptop A also serves as LB node
nodes:
  node1:
    laptop: A
    raft_port: 19091 # Exposed port for Raft control plane
    lb_port: 8001 # Load balancer listener port
  node2:
    laptop: A
    raft_port: 19092
    lb_port: 8002
  node3:
    laptop: B
    raft_port: 19093
    lb_port: 8003
  node4:
    laptop: C
    raft_port: 19094
    lb_port: 8004
  node5:
    laptop: C
    raft_port: 19095
    lb_port: 8005

# Data plane backends (stateless request handlers)
backends:
  backend-1:
    laptop: A
    port: 8081
  backend-2:
    laptop: A
    port: 8082
  backend-3:
    laptop: A
    port: 8083
  backend-4:
    laptop: B
    port: 8084
  backend-5:
    laptop: B
    port: 8085
  backend-6:
    laptop: B
    port: 8086
  backend-7:
    laptop: B
    port: 8087
  backend-8:
    laptop: C
    port: 8088
  backend-9:
    laptop: C
    port: 8089
  backend-10:
    laptop: C
    port: 8090

# Discovery service (DNS + health state distribution)
# Only runs on Laptop A
discovery:
  laptop: B
  udp_port: 6699 # DNS port for service discovery
  http_port: 6701 # HTTP port for state queries
